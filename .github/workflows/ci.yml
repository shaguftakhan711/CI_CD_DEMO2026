name: CI Demo

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          ls

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run automated tests
        run: node test.js
        
      - name: Build application
        run: |
            mkdir build
            cp index.html build/
            cp style.css build/
            cp script.js build/
            echo "Build completed successfully"

      - name: Verify build
        run: |
            echo "Build contents:"
            ls -la build